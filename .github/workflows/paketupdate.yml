
name: Paket update2

on:
  push:
    paths:
      - 'paket.dependencies'
      - 'paket.lock'
  workflow_dispatch: {}
  
permissions:
  contents: write
  pull-requests: write
  
jobs:
  update-paket:
    name: Update Paket dependencies and open PR
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.0.x'

      - name: Restore dotnet tools
        shell: pwsh
        run: |
          dotnet tool restore

      - name: Run paket update via dotnet tool
        shell: pwsh
        run: |
          dotnet paket update

      - name: Create Pull Request with updated dependencies
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update paket dependencies"
          branch: "paket-update-${{ github.run_number }}"
          title: "chore(deps): update paket dependencies"
          body: |
            Automated Paket update (ran on changes to paket.dependencies) generated by GitHub Actions.
          labels: "dependencies, automated"
